<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<!-- PWA: 홈 화면에 추가하면 전체화면 앱으로 실행 -->
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f7ef">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="일기장">
<title>일기장 | Minb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">

<!-- Firebase 10.8.0 Compat SDK -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<style>
  :root {
    --red: #c75348;
    --red-hover: #a83d35;
    --red-light: #fbecea;
    --yellow: #f3c95d;
    --gold: #df8746;
    --dark: #182235;
    --card: #fffefa;
    --bg: #f4f7ef;
    --text: #202936;
    --muted: #667085;
    --border: #dde5d9;
    --green: #3b8669;
    --green-light: #e5f3eb;
    --blue: #38679b;
    --blue-light: #e7f0fa;
    --purple: #6b5aa6;
    --purple-light: #f0edf8;
    --cream: #fff0c8;
    --surface: rgba(255, 254, 250, 0.78);

    --radius: 14px;
    --radius-sm: 8px;
    --shadow: 0 10px 28px rgba(37, 56, 72, 0.07);
    --shadow-hover: 0 14px 36px rgba(37, 56, 72, 0.12);
    --transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
  }
  body.dark {
    --bg: #111717;
    --card: #1a2224;
    --text: #f1f3ee;
    --muted: #aab4ad;
    --border: #2c3838;
    /* 강조색을 밝게 보정해 어두운 배경에서도 대비 확보 */
    --red: #ef5e5e;
    --green: #4caf50;
    --blue: #4d90e0;
    --purple: #b39ddb;
    --gold: #ffa726;
    --red-light: rgba(239, 94, 94, 0.18);
    --green-light: rgba(76, 175, 80, 0.18);
    --blue-light: rgba(77, 144, 224, 0.18);
    --purple-light: rgba(179, 157, 219, 0.22);
    --shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
    --shadow-hover: 0 8px 32px rgba(0, 0, 0, 0.4);
    --dark: #ffffff;
    --surface: rgba(26, 34, 36, 0.78);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    font-family: 'Outfit', 'Noto Sans KR', sans-serif;
    background: linear-gradient(180deg, var(--bg) 0%, #eef4f0 52%, #f8f6ef 100%);
    color: var(--text);
    min-height: 100vh; min-height: 100dvh; line-height: 1.5;
    overflow-x: hidden; overflow-wrap: anywhere;
    transition: var(--transition);
  }
  body.dark { background: linear-gradient(180deg, #111717 0%, #151f22 58%, #101417 100%); }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  /* ── HEADER (메인 대시보드와 동일한 글래스 헤더) ── */
  header {
    background: rgba(255, 254, 250, 0.82);
    color: var(--text);
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 8px 26px rgba(37, 56, 72, 0.08);
    border-bottom: 1px solid rgba(221, 229, 217, 0.78);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    padding-top: env(safe-area-inset-top);
  }
  body.dark header {
    background: rgba(18, 24, 25, 0.82);
    border-bottom-color: rgba(52, 66, 66, 0.76);
  }
  .header-top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px; flex-wrap: wrap; gap: 12px;
    max-width: 1060px; margin: 0 auto;
  }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-flag {
    width: 38px; height: 38px; border-radius: 12px; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #6b5aa6 0%, #38679b 100%);
    font-size: 19px; line-height: 1;
    box-shadow: 0 8px 20px rgba(37, 56, 72, 0.2), inset 0 0 0 1px rgba(255,255,255,0.16);
  }
  .logo-text h1 { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; }
  .logo-text p { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .hbtn {
    background: rgba(255,255,255,0.62);
    border: 1px solid var(--border);
    color: var(--text); padding: 6px 14px; border-radius: 20px;
    font-size: 12px; font-weight: 600; cursor: pointer;
    text-decoration: none; transition: var(--transition);
    display: inline-flex; align-items: center; gap: 6px; font-family: inherit;
  }
  body.dark .hbtn { background: rgba(255,255,255,0.08); }
  .hbtn:hover { background: var(--purple-light); border-color: transparent; color: var(--purple); transform: translateY(-1px); }
  .profile-badge {
    background: rgba(255,255,255,0.66); border: 1px solid var(--border);
    color: var(--text); padding: 5px 12px; border-radius: 20px;
    font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 8px;
  }
  body.dark .profile-badge { background: rgba(255,255,255,0.08); }
  .logout-btn {
    background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 11px; text-decoration: underline; font-weight: 600;
    padding-left: 4px; border-left: 1px solid var(--border);
  }
  .logout-btn:hover { color: var(--purple); }

  main { max-width: 1020px; margin: 28px auto; padding: 0 20px; }
  .grid { display: grid; grid-template-columns: 0.9fr 1.1fr; gap: 18px; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--surface); border: 1px solid rgba(221, 229, 217, 0.86);
    border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow);
    transition: var(--transition);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  body.dark .card { border-color: rgba(255,255,255,0.08); }
  .card-title { font-size: 15px; font-weight: 800; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }

  @keyframes fadeIn { from { opacity:0; transform: translateY(8px);} to {opacity:1; transform:translateY(0);} }
  .fade { animation: fadeIn 0.4s ease; }

  /* ── 스트릭 배너 (메인 히어로와 같은 톤) ── */
  .streak-banner {
    background: linear-gradient(135deg, #2f3a63 0%, #5b5aa6 62%, #8a6fd6 100%);
    color: #fff; border-radius: 18px; padding: 24px 26px; margin-bottom: 18px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;
    box-shadow: var(--shadow); border: 1px solid rgba(255,255,255,0.16);
  }
  .streak-banner .big { font-size: 20px; font-weight: 900; letter-spacing: -0.3px; }
  .streak-banner .small { font-size: 13px; opacity: 0.85; margin-top: 6px; }

  /* ── 에디터 ── */
  .editor-date-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .editor-date-row input[type="date"] {
    background: rgba(255,255,255,0.64); border: 1.5px solid var(--border); border-radius: 12px;
    padding: 8px 12px; font-size: 14px; font-weight: 700; color: var(--text); font-family: inherit;
    outline: none; transition: var(--transition);
  }
  .editor-date-row input[type="date"]:focus { border-color: var(--purple); }
  body.dark .editor-date-row input[type="date"] { background: rgba(255,255,255,0.06); color-scheme: dark; }

  .mood-row { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .mood-btn {
    background: rgba(255,255,255,0.64); border: 1.5px solid var(--border); border-radius: 12px;
    font-size: 20px; padding: 7px 11px; cursor: pointer; transition: var(--transition);
  }
  body.dark .mood-btn { background: rgba(255,255,255,0.06); }
  .mood-btn:hover { transform: scale(1.12); }
  .mood-btn.active { border-color: var(--purple); background: var(--purple-light); box-shadow: 0 2px 8px rgba(107,90,166,0.2); }

  .diary-area {
    width: 100%; min-height: 320px; background: rgba(255,255,255,0.64);
    border: 1.5px solid var(--border); border-radius: 12px; padding: 16px;
    font-size: 14.5px; color: var(--text); font-family: inherit; line-height: 1.9;
    resize: vertical; outline: none; transition: var(--transition);
  }
  body.dark .diary-area { background: rgba(255,255,255,0.06); }
  .diary-area:focus { border-color: var(--purple); }
  .editor-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; gap: 10px; }
  .char-count { font-size: 12px; color: var(--muted); }
  .btn-row { display: flex; gap: 8px; }
  .primary-btn {
    background: linear-gradient(135deg, var(--purple), var(--blue)); color: white; border: none; border-radius: 12px;
    padding: 10px 22px; font-size: 13.5px; font-weight: 700; cursor: pointer;
    font-family: inherit; transition: var(--transition); white-space: nowrap;
    box-shadow: 0 8px 20px rgba(107,90,166,0.22);
  }
  .primary-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .ghost-btn {
    background: rgba(255,255,255,0.5); border: 1.5px solid var(--border); border-radius: 12px;
    padding: 10px 16px; font-size: 13px; font-weight: 700; color: var(--muted);
    cursor: pointer; font-family: inherit; transition: var(--transition);
  }
  body.dark .ghost-btn { background: rgba(255,255,255,0.06); }
  .ghost-btn:hover { color: var(--red); border-color: var(--red); }
  .save-hint { font-size: 11.5px; color: var(--green); font-weight: 700; }

  /* ── 목록 ── */
  .search-input {
    width: 100%; background: rgba(255,255,255,0.64); border: 1.5px solid var(--border); border-radius: 12px;
    padding: 9px 12px; font-size: 13px; color: var(--text); font-family: inherit; outline: none;
    margin-bottom: 12px; transition: var(--transition);
  }
  body.dark .search-input { background: rgba(255,255,255,0.06); }
  .search-input:focus { border-color: var(--purple); }
  .month-nav { display: flex; align-items: center; gap: 8px; }
  .month-nav button {
    background: rgba(255,255,255,0.5); border: 1.5px solid var(--border); border-radius: 10px;
    width: 30px; height: 30px; cursor: pointer; color: var(--text); font-weight: 700;
    font-family: inherit; transition: var(--transition);
  }
  body.dark .month-nav button { background: rgba(255,255,255,0.06); }
  .month-nav button:hover { border-color: var(--purple); color: var(--purple); }
  .month-nav .label { font-size: 13px; font-weight: 800; min-width: 84px; text-align: center; }

  .entry-item {
    background: rgba(255,255,255,0.42); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 10px; cursor: pointer; transition: var(--transition);
  }
  body.dark .entry-item { background: rgba(255,255,255,0.035); }
  .entry-item:hover { border-color: var(--purple); box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .entry-item.selected { border-color: var(--purple); background: var(--purple-light); }
  .entry-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .entry-date { font-size: 13px; font-weight: 800; }
  .entry-mood { font-size: 16px; }
  .entry-preview { font-size: 12.5px; color: var(--muted); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-all; }
  .empty-msg { color: var(--muted); font-size: 13px; text-align: center; padding: 30px 0; line-height: 1.7; }

  /* ── 로그인 오버레이 (메인과 동일) ── */
  #loginOverlay {
    position: fixed; inset: 0; background: rgba(18, 18, 20, 0.6);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    z-index: 1000; display: flex; align-items: center; justify-content: center;
  }
  .login-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 18px;
    max-width: 420px; width: 90%; text-align: center; padding: 40px 28px;
    box-shadow: 0 18px 50px rgba(24,34,53,0.22);
  }
  .login-mark {
    width: 70px; height: 70px; margin: 0 auto 20px; border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #6b5aa6 0%, #38679b 100%);
    font-size: 36px; line-height: 1;
    box-shadow: 0 12px 28px rgba(37,56,72,0.22), inset 0 0 0 1px rgba(255,255,255,0.16);
  }
  .google-btn {
    background: var(--dark); color: var(--card); border: none; padding: 14px 28px;
    border-radius: 14px; font-size: 15px; font-weight: 800; cursor: pointer; width: 100%;
    transition: var(--transition); display: flex; align-items: center; justify-content: center; gap: 10px;
    box-shadow: 0 10px 24px rgba(24,34,53,0.18); font-family: inherit;
  }
  .google-btn:hover { transform: translateY(-1px); filter: brightness(1.08); }

  #toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--dark); color: var(--card); padding: 12px 24px; border-radius: 24px;
    font-size: 13px; font-weight: 700; z-index: 2000; opacity: 0; transition: all 0.35s ease;
    pointer-events: none; box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  }
  body.dark #toast { background: #e1e1e6; color: #1e1e24; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── 모바일 (메인과 동일한 축소 규칙) ── */
  @media (max-width: 760px) {
    /* iOS는 16px 미만 입력창에 포커스하면 화면을 자동 확대한다. */
    @supports (-webkit-touch-callout: none) {
      input, textarea, select { font-size: 16px !important; }
    }
    .header-top { padding: 10px 14px; gap: 8px; }
    .logo { gap: 8px; }
    .logo-flag { width: 32px; height: 32px; border-radius: 10px; font-size: 16px; }
    .logo-text h1 { font-size: 16px; }
    .logo-text p { display: none; }
    .header-right { gap: 6px; }
    .hbtn { padding: 5px 10px; font-size: 11px; }
    main { margin: 12px auto 20px; padding: 0 10px; }
    .card { padding: 14px; border-radius: 12px; }
    .card-title { font-size: 14px; margin-bottom: 10px; }
    .streak-banner { padding: 14px 16px; margin-bottom: 12px; border-radius: 12px; gap: 10px; }
    .streak-banner .big { font-size: 17px; }
    .diary-area { min-height: 240px; }
  }
</style>
</head>
<body>

<div id="loginOverlay" style="display:none;">
  <div class="login-card">
    <div class="login-mark">📔</div>
    <h2 style="font-size: 22px; font-weight: 900; margin-bottom: 8px; color: var(--dark);">나만의 일기장</h2>
    <p style="font-size: 13.5px; color: var(--muted); margin-bottom: 28px; line-height: 1.6;">
      일기는 본인 계정에만 안전하게 저장돼요.<br>구글 로그인 후 작성할 수 있습니다.
    </p>
    <button onclick="loginWithGoogle()" class="google-btn">
      <svg style="width:18px; height:18px; fill:currentColor" viewBox="0 0 24 24"><path d="M12.24 10.285V14.4h6.887c-.648 2.41-2.519 4.114-5.136 4.114-3.513 0-6.386-2.87-6.386-6.385s2.87-6.386 6.386-6.386c1.61 0 3.076.61 4.2 1.61l3.053-3.053C19.16 2.457 15.903 1 12.24 1c-6.077 0-11 4.923-11 11s4.923 11 11 11c5.962 0 10.884-4.854 10.884-11 0-.693-.077-1.37-.216-2.03H12.24z"/></svg>
      Google 계정으로 시작하기
    </button>
  </div>
</div>

<header>
  <div class="header-top">
    <div class="logo">
      <span class="logo-flag">📔</span>
      <div class="logo-text">
        <h1>일기장</h1>
        <p>하루를 마무리하는 나만의 기록</p>
      </div>
    </div>
    <div class="header-right">
      <a href="./" class="hbtn">🏠 Minb</a>
      <a href="shared-diary.html" class="hbtn">💌 교환일기</a>
      <a href="study.html" class="hbtn">🇪🇸 스터디</a>
      <span id="userProfile" class="profile-badge" style="display: none;">
        <span id="userName">👤 로딩중...</span>
        <button onclick="logout()" class="logout-btn">로그아웃</button>
      </span>
      <button id="themeToggle" class="hbtn" onclick="toggleTheme()">🌓 테마</button>
    </div>
  </div>
</header>

<main class="fade">

  <div class="streak-banner">
    <div>
      <div class="big" id="streakTitle">✍️ 일기를 시작해 보세요</div>
      <div class="small" id="streakSub">꾸준한 기록이 가장 좋은 선물이에요.</div>
    </div>
    <div style="font-size: 38px;" id="streakEmoji">🌱</div>
  </div>

  <div class="grid">
    <!-- 목록 -->
    <div class="card">
      <div class="card-title">
        <span>🗂 일기 목록</span>
        <div class="month-nav" id="monthNav">
          <button onclick="moveMonth(-1)">‹</button>
          <span class="label" id="monthLabel"></span>
          <button onclick="moveMonth(1)">›</button>
        </div>
      </div>
      <input id="diarySearch" class="search-input" placeholder="🔍 전체 일기에서 검색…" oninput="onDiarySearch(this.value)">
      <div id="entryList"></div>
    </div>

    <!-- 에디터 -->
    <div class="card">
      <div class="card-title"><span>✏️ 일기 쓰기</span><span class="save-hint" id="saveHint"></span></div>
      <div class="editor-date-row">
        <input type="date" id="entryDate" onchange="loadEntry(this.value)">
        <button class="ghost-btn" style="color: var(--text);" onclick="goTodayEntry()">오늘</button>
      </div>
      <div class="mood-row" id="moodRow"></div>
      <textarea id="diaryArea" class="diary-area" placeholder="오늘 하루는 어땠나요?&#10;&#10;기억에 남는 순간, 감정, 내일의 다짐… 무엇이든 좋아요." oninput="updateCharCount()"></textarea>
      <div class="editor-footer">
        <span class="char-count" id="charCount">0자</span>
        <div class="btn-row">
          <button class="ghost-btn" id="deleteBtn" onclick="deleteEntry()" style="display:none;">삭제</button>
          <button class="primary-btn" onclick="saveEntry()">저장하기</button>
        </div>
      </div>
    </div>
  </div>

</main>

<div id="toast"></div>

<script>
// ══════════════════════════════════════
// FIREBASE INIT
// ══════════════════════════════════════
const firebaseConfig = {
  apiKey: "AIzaSyDP1btfiPrymhvrYepVc8u8PatdiZq01D0",
  authDomain: "minb-spanish-study.firebaseapp.com",
  projectId: "minb-spanish-study",
  storageBucket: "minb-spanish-study.firebasestorage.app",
  messagingSenderId: "130349023752",
  appId: "1:130349023752:web:5c6c3985091f58959587bd"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;
let diary = {};                  // { 'YYYY-MM-DD': { text, mood } }
let viewMonth = new Date();      // 목록에 보여줄 달
let editingKey = todayKey();     // 에디터가 가리키는 날짜

const MOODS = ['😊','😆','😌','😐','😢','😡','🥰','💪','😴','🤒'];
function todayKey() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

// ══════════════════════════════════════
// AUTH
// ══════════════════════════════════════
// 리다이렉트 로그인 복귀 시 에러 표면화 (정상 로그인은 onAuthStateChanged가 처리)
auth.getRedirectResult().catch(e => {
  if (e && e.code && e.code !== 'auth/no-auth-event') {
    console.error('리다이렉트 로그인 에러:', e);
    alert('구글 로그인 중 문제가 발생했습니다.\n코드: ' + e.code + '\n메시지: ' + e.message);
  }
});

auth.onAuthStateChanged(async (user) => {
  if (user) {
    currentUser = user;
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('userProfile').style.display = 'flex';
    document.getElementById('userName').textContent = `👤 ${user.displayName || '사용자'}`;
    loadDiary();
  } else {
    currentUser = null;
    document.getElementById('loginOverlay').style.display = 'flex';
    document.getElementById('userProfile').style.display = 'none';
    if (unsubDiary) { unsubDiary(); unsubDiary = null; }
  }
});

async function loginWithGoogle() {
  // iOS/Android 앱(Capacitor)에서는 네이티브 구글 로그인을 사용한다
  // (웹뷰에서는 구글이 OAuth 팝업을 차단하기 때문)
  const cap = window.Capacitor;
  if (cap && cap.isNativePlatform && cap.isNativePlatform()) {
    try {
      const result = await cap.Plugins.FirebaseAuthentication.signInWithGoogle();
      const idToken = result.credential && result.credential.idToken;
      const accessToken = result.credential && result.credential.accessToken;
      if (!idToken) throw new Error('네이티브 로그인에서 토큰을 받지 못했습니다.');
      const credential = firebase.auth.GoogleAuthProvider.credential(idToken, accessToken || null);
      await auth.signInWithCredential(credential);
    } catch (e) {
      console.error('네이티브 로그인 에러:', e);
      alert('구글 로그인 중 문제가 발생했습니다.\n' + (e.message || e));
    }
    return;
  }
  const provider = new firebase.auth.GoogleAuthProvider();
  // 팝업 우선 (iOS 홈 화면 앱에서도 팝업이 리다이렉트보다 안정적)
  try {
    await auth.signInWithPopup(provider);
  } catch (e) {
    // 팝업이 차단되면 리다이렉트로 자동 전환
    if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment' || e.code === 'auth/cancelled-popup-request') {
      try { await auth.signInWithRedirect(provider); return; } catch (e2) { e = e2; }
    }
    console.error('로그인 에러:', e);
    alert(`구글 로그인 중 문제가 발생했습니다.\n코드: ${e.code}\n메시지: ${e.message}`);
  }
}
async function logout() {
  if (confirm('로그아웃 하시겠습니까?')) { await auth.signOut(); location.reload(); }
}

// ══════════════════════════════════════
// DATA
// ══════════════════════════════════════
// 실시간 구독 — 다른 기기에서 쓴 일기도 즉시 반영
let unsubDiary = null;
function loadDiary() {
  if (unsubDiary) unsubDiary();
  unsubDiary = db.collection('users').doc(currentUser.uid).onSnapshot(snap => {
    diary = (snap.exists && snap.data().diary) || {};
    if (isDirty()) {
      // 작성 중인 글은 건드리지 않고 목록·스트릭만 갱신
      renderList();
      renderStreak();
    } else {
      renderAll();
    }
  }, e => console.error('일기 실시간 구독 실패:', e));
}

async function saveEntry() {
  if (!currentUser) return;
  const text = document.getElementById('diaryArea').value.trim();
  if (!text) { toast('내용을 입력해 주세요 ✍️'); return; }
  const entry = { text, mood: selectedMood, updatedAt: Date.now() };
  diary[editingKey] = entry;
  try {
    await db.collection('users').doc(currentUser.uid).set({ diary: { [editingKey]: entry } }, { merge: true });
    clearDraft(editingKey); // 저장 성공 → 임시 저장본 정리
    document.getElementById('saveHint').textContent = '✅ 저장됨';
    setTimeout(() => document.getElementById('saveHint').textContent = '', 2000);
    renderAll();
    toast('📔 일기가 저장됐어요!');
  } catch (e) { console.error('저장 실패:', e); toast('저장에 실패했어요. 네트워크를 확인해 주세요.'); }
}

async function deleteEntry() {
  if (!diary[editingKey]) return;
  if (!confirm('이 날의 일기를 삭제할까요? 되돌릴 수 없어요.')) return;
  delete diary[editingKey];
  try {
    await db.collection('users').doc(currentUser.uid).update({
      [`diary.${editingKey}`]: firebase.firestore.FieldValue.delete()
    });
    clearDraft(editingKey);
    renderAll();
    toast('일기를 삭제했어요.');
  } catch (e) { console.error('삭제 실패:', e); toast('삭제에 실패했어요.'); }
}

// ══════════════════════════════════════
// EDITOR
// ══════════════════════════════════════
let selectedMood = MOODS[0];

function renderMoodRow() {
  document.getElementById('moodRow').innerHTML = MOODS.map(m =>
    `<button class="mood-btn ${m === selectedMood ? 'active' : ''}" onclick="pickMood('${m}')">${m}</button>`
  ).join('');
}
function pickMood(m) { selectedMood = m; renderMoodRow(); scheduleDraft(); }

// 저장 안 한 일기 내용이 있는지 확인
function isDirty() {
  const cur = document.getElementById('diaryArea').value.trim();
  const saved = (diary[editingKey] && diary[editingKey].text || '').trim();
  return cur !== saved;
}

// ── 임시 저장 (작성 중 내용 유실 방지) ──
// 저장 전 내용을 기기(localStorage)에 자동 보관하고, 날짜를 옮겨도 되돌아오면 복원한다.
const DRAFT_KEY = 'diary_drafts';
let draftTimer = null;
function getDrafts() {
  try { return JSON.parse(localStorage.getItem(DRAFT_KEY)) || {}; } catch { return {}; }
}
function flushDraft() {
  clearTimeout(draftTimer);
  const drafts = getDrafts();
  if (isDirty()) {
    drafts[editingKey] = { text: document.getElementById('diaryArea').value, mood: selectedMood, t: Date.now() };
  } else {
    delete drafts[editingKey];
  }
  localStorage.setItem(DRAFT_KEY, JSON.stringify(drafts));
}
function scheduleDraft() {
  clearTimeout(draftTimer);
  draftTimer = setTimeout(flushDraft, 400);
}
function clearDraft(key) {
  const drafts = getDrafts();
  delete drafts[key];
  localStorage.setItem(DRAFT_KEY, JSON.stringify(drafts));
}

function loadEntry(key) {
  if (key !== editingKey) flushDraft(); // 이동 전 작성 중이던 내용을 임시 저장
  editingKey = key;
  const e = diary[key];
  document.getElementById('entryDate').value = key;
  document.getElementById('diaryArea').value = e ? e.text : '';
  selectedMood = e && e.mood ? e.mood : MOODS[0];
  // 저장본과 다른 임시 저장본이 있으면 복원해서 이어쓰기
  const draft = getDrafts()[key];
  const hint = document.getElementById('saveHint');
  if (draft && (draft.text || '').trim() && (draft.text || '').trim() !== (e ? e.text : '').trim()) {
    document.getElementById('diaryArea').value = draft.text;
    if (draft.mood) selectedMood = draft.mood;
    hint.textContent = '📝 임시 저장본 복원됨';
  } else {
    hint.textContent = '';
  }
  document.getElementById('deleteBtn').style.display = e ? 'inline-block' : 'none';
  renderMoodRow();
  updateCharCount();
  renderList(); // selected 표시 갱신
}
function goTodayEntry() { loadEntry(todayKey()); }
function updateCharCount() {
  document.getElementById('charCount').textContent = `${document.getElementById('diaryArea').value.length}자`;
  scheduleDraft();
}

// Ctrl/Cmd + S 로 바로 저장
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveEntry(); }
});
// 앱을 닫거나 새로고침해도 작성 중 내용을 남긴다
window.addEventListener('beforeunload', flushDraft);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushDraft(); });

// ══════════════════════════════════════
// LIST & STREAK
// ══════════════════════════════════════
function moveMonth(delta) { viewMonth.setMonth(viewMonth.getMonth() + delta); renderList(); }
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// 일기 키워드 검색 (전체 기간 대상)
let diarySearchQuery = '';
function onDiarySearch(q) {
  diarySearchQuery = q.trim().toLowerCase();
  document.getElementById('monthNav').style.visibility = diarySearchQuery ? 'hidden' : 'visible';
  renderList();
}

function renderList() {
  const box = document.getElementById('entryList');
  const DAYS_KO = ['일','월','화','수','목','금','토'];
  let keys;

  if (diarySearchQuery) {
    keys = Object.keys(diary)
      .filter(k => (diary[k].text || '').toLowerCase().includes(diarySearchQuery))
      .sort().reverse();
    if (!keys.length) {
      box.innerHTML = `<div class="empty-msg">"${esc(diarySearchQuery)}"가 들어간 일기가 없어요 🔍</div>`;
      return;
    }
  } else {
    const y = viewMonth.getFullYear(), m = viewMonth.getMonth();
    document.getElementById('monthLabel').textContent = `${y}년 ${m+1}월`;
    const prefix = `${y}-${String(m+1).padStart(2,'0')}`;
    keys = Object.keys(diary).filter(k => k.startsWith(prefix)).sort().reverse();
    if (!keys.length) {
      box.innerHTML = '<div class="empty-msg">이 달에는 아직 일기가 없어요.<br>오른쪽에서 첫 일기를 써보세요 🌱</div>';
      return;
    }
  }

  box.innerHTML = keys.map(k => {
    const e = diary[k];
    const [yy,mm,dd] = k.split('-').map(Number);
    const day = DAYS_KO[new Date(yy, mm-1, dd).getDay()];
    const dateLabel = diarySearchQuery ? `${yy}년 ${mm}월 ${dd}일 (${day})` : `${mm}월 ${dd}일 (${day})`;
    return `<div class="entry-item ${k === editingKey ? 'selected' : ''}" onclick="loadEntry('${k}')">
      <div class="entry-head">
        <span class="entry-mood">${e.mood || '📝'}</span>
        <span class="entry-date">${dateLabel}</span>
      </div>
      <div class="entry-preview">${esc(e.text)}</div>
    </div>`;
  }).join('');
}

function renderStreak() {
  const total = Object.keys(diary).length;
  // 오늘부터 거꾸로 연속 일수 계산 (오늘 안 썼으면 어제부터)
  let streak = 0;
  const d = new Date();
  if (!diary[todayKey()]) d.setDate(d.getDate() - 1);
  while (true) {
    const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if (diary[k]) { streak++; d.setDate(d.getDate() - 1); } else break;
  }
  const title = document.getElementById('streakTitle');
  const sub = document.getElementById('streakSub');
  const emoji = document.getElementById('streakEmoji');
  if (!total) {
    title.textContent = '✍️ 일기를 시작해 보세요';
    sub.textContent = '꾸준한 기록이 가장 좋은 선물이에요.';
    emoji.textContent = '🌱';
  } else {
    title.textContent = streak >= 2 ? `🔥 ${streak}일 연속 기록 중!` : `📚 지금까지 ${total}편의 일기`;
    sub.textContent = diary[todayKey()] ? '오늘의 일기 완료! 내일도 만나요.' : '오늘의 일기가 아직 비어있어요.';
    emoji.textContent = streak >= 7 ? '🏆' : streak >= 3 ? '🔥' : '🌿';
  }
}

function renderAll() {
  renderList();
  renderStreak();
  loadEntry(editingKey);
}

// ══════════════════════════════════════
// THEME / TOAST
// ══════════════════════════════════════
function toggleTheme() {
  const isDark = document.body.classList.toggle('dark');
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
  updateThemeButton();
}
function updateThemeButton() {
  document.getElementById('themeToggle').innerHTML = document.body.classList.contains('dark') ? '☀️ 라이트' : '🌙 다크';
}
function loadTheme() {
  if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');
  updateThemeButton();
}

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

loadTheme();
renderMoodRow();
loadEntry(editingKey);
</script>
