<style>
  :root {
    --red: #d32f2f;
    --red-light: #fdf2f2;
    --dark: #1e1e24;
    --card: #ffffff;
    --bg: #fcf9f5;
    --text: #2c2c35;
    --muted: #70757f;
    --border: #e9e2d9;
    --green: #2e7d32;
    --green-light: #e8f5e9;
    --blue: #1565c0;
    --blue-light: #e3f2fd;
    --rose: #c2185b;
    --rose-dark: #880e4f;
    --rose-light: #fce4ec;

    --radius: 16px;
    --shadow: 0 4px 18px rgba(0, 0, 0, 0.05);
    --shadow-hover: 0 8px 30px rgba(194, 24, 91, 0.12);
    --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  body.dark {
    --bg: #121214;
    --card: #1e1e24;
    --text: #e1e1e6;
    --muted: #a1a1aa;
    --border: #2e2e35;
    --red-light: rgba(211, 47, 47, 0.15);
    --green-light: rgba(46, 125, 50, 0.15);
    --blue-light: rgba(21, 101, 192, 0.15);
    --rose-light: rgba(194, 24, 91, 0.18);
    --shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
    --shadow-hover: 0 8px 32px rgba(0, 0, 0, 0.4);
    --dark: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Outfit', 'Noto Sans KR', sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    transition: var(--transition);
  }

  header {
    background: linear-gradient(135deg, var(--rose) 0%, var(--rose-dark) 100%);
    color: white; position: sticky; top: 0; z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  }
  .header-top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px; flex-wrap: wrap; gap: 12px;
    max-width: 1060px; margin: 0 auto;
  }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-flag { font-size: 32px; }
  .logo-text h1 { font-size: 18px; font-weight: 800; }
  .logo-text p { font-size: 12px; opacity: 0.75; margin-top: 3px; }
  .header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .hbtn {
    background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25);
    color: white; padding: 6px 14px; border-radius: 20px;
    font-size: 12px; font-weight: 600; cursor: pointer;
    text-decoration: none; transition: var(--transition);
    display: inline-flex; align-items: center; gap: 6px; font-family: inherit;
  }
  .hbtn:hover { background: rgba(255,255,255,0.28); transform: translateY(-1px); }
  .profile-badge {
    background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3);
    color: white; padding: 5px 12px; border-radius: 20px;
    font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 8px;
  }
  .logout-btn {
    background: none; border: none; color: rgba(255,255,255,0.85); cursor: pointer;
    font-size: 11px; text-decoration: underline; font-weight: 600;
    padding-left: 4px; border-left: 1px solid rgba(255,255,255,0.3);
  }

  main { max-width: 1020px; margin: 28px auto; padding: 0 20px; }
  .grid { display: grid; grid-template-columns: 0.9fr 1.1fr; gap: 18px; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow);
  }
  .card-title { font-size: 15px; font-weight: 800; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }

  @keyframes fadeIn { from { opacity:0; transform: translateY(8px);} to {opacity:1; transform:translateY(0);} }
  .fade { animation: fadeIn 0.4s ease; }

  /* ── 날짜 히어로 ── */
  .hero {
    background: linear-gradient(135deg, var(--rose), #e91e63);
    color: white; border-radius: var(--radius); padding: 22px 26px;
    margin-bottom: 18px; box-shadow: var(--shadow);
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px;
  }
  .hero h2 { font-size: 20px; font-weight: 900; }
  .hero .sub { font-size: 12.5px; opacity: 0.85; margin-top: 5px; }
  .date-nav { display: flex; align-items: center; gap: 8px; }
  .date-nav button {
    background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
    color: white; width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
    font-size: 15px; font-weight: 700; transition: var(--transition);
  }
  .date-nav button:hover { background: rgba(255,255,255,0.3); }
  .date-nav .today-btn { width: auto; border-radius: 18px; padding: 0 14px; font-size: 12px; }
  .date-nav input[type="date"] {
    background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
    color: white; padding: 6px 10px; border-radius: 10px; font-family: inherit;
    font-size: 13px; font-weight: 600; color-scheme: dark;
  }

  /* ── 멤버 글 카드 ── */
  .partner-entry {
    border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px;
    background: var(--rose-light);
  }
  .partner-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 13px; font-weight: 800; }
  .partner-head img { width: 22px; height: 22px; border-radius: 50%; }
  .partner-text { font-size: 14px; line-height: 1.8; white-space: pre-wrap; word-break: break-all; }
  .partner-time { font-size: 11px; color: var(--muted); margin-top: 8px; text-align: right; }

  /* ── 에디터 ── */
  .mood-row { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .mood-btn {
    background: var(--bg); border: 1.5px solid var(--border); border-radius: 12px;
    font-size: 20px; padding: 6px 10px; cursor: pointer; transition: var(--transition);
  }
  .mood-btn:hover { transform: scale(1.12); }
  .mood-btn.active { border-color: var(--rose); background: var(--rose-light); }
  .diary-area {
    width: 100%; min-height: 220px; background: var(--bg);
    border: 1.5px solid var(--border); border-radius: 12px; padding: 14px;
    font-size: 14.5px; color: var(--text); font-family: inherit; line-height: 1.9;
    resize: vertical; outline: none; transition: var(--transition);

  .diary-area:focus { border-color: var(--rose); }
  .editor-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; gap: 10px; }
  .char-count { font-size: 12px; color: var(--muted); }
  .primary-btn {
    background: var(--rose); color: white; border: none; border-radius: 12px;
    padding: 10px 22px; font-size: 13.5px; font-weight: 700; cursor: pointer;
    font-family: inherit; transition: var(--transition);
  }
  .primary-btn:hover { filter: brightness(1.12); }
  .ghost-btn {
    background: none; border: 1.5px solid var(--border); border-radius: 12px;
    padding: 10px 16px; font-size: 13px; font-weight: 700; color: var(--muted);
    cursor: pointer; font-family: inherit; transition: var(--transition);
  }
  .ghost-btn:hover { color: var(--red); border-color: var(--red); }
  .save-hint { font-size: 11.5px; color: var(--green); font-weight: 700; }

  /* ── 목록 ── */
  .month-nav { display: flex; align-items: center; gap: 12px; }
  .month-nav button {
    background: var(--bg); border: 1.5px solid var(--border); border-radius: 8px;
    width: 28px; height: 28px; cursor: pointer; color: var(--text); font-weight: 700;
  }
  .month-nav .label { font-size: 14px; font-weight: 800; min-width: 90px; text-align: center; }
  .entry-item {
    border: 1px solid var(--border); border-radius: 12px; padding: 13px 15px;
    margin-bottom: 10px; cursor: pointer; transition: var(--transition);
  }
  .entry-item:hover { border-color: var(--rose); box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .entry-item.selected { border-color: var(--rose); background: var(--rose-light); }
  .entry-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .entry-date { font-size: 13px; font-weight: 800; }
  .entry-authors { margin-left: auto; font-size: 11.5px; color: var(--muted); }
  .entry-preview { font-size: 12.5px; color: var(--muted); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-all; }
  .empty-msg { color: var(--muted); font-size: 13px; text-align: center; padding: 26px 0; line-height: 1.7; }

  .member-chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .member-chip {
    display: inline-flex; align-items: center; gap: 7px; background: var(--rose-light);
    border: 1px solid var(--border); padding: 5px 12px; border-radius: 16px; font-size: 12.5px; font-weight: 700;
  }
  .member-chip img { width: 20px; height: 20px; border-radius: 50%; }

  /* ── 로그인 오버레이 ── */
  #loginOverlay {
    position: fixed; inset: 0; background: rgba(18, 18, 20, 0.6);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    z-index: 1000; display: flex; align-items: center; justify-content: center;
  }
  .login-card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    max-width: 420px; width: 90%; text-align: center; padding: 40px 28px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.3);
  }
  .google-btn {
    background: var(--rose); color: white; border: none; padding: 14px 28px;
    border-radius: 28px; font-size: 15px; font-weight: 700; cursor: pointer; width: 100%;
    transition: var(--transition); display: flex; align-items: center; justify-content: center; gap: 10px;
    font-family: inherit;
  }

  #toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--dark); color: var(--card); padding: 12px 24px; border-radius: 24px;
    font-size: 13px; font-weight: 700; z-index: 2000; opacity: 0; transition: all 0.35s ease;
    pointer-events: none; box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  }
  body.dark #toast { background: #e1e1e6; color: #1e1e24; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>

<script>
// ══════════════════════════════════════
// FIREBASE INIT
// ══════════════════════════════════════
const firebaseConfig = {
  apiKey: "AIzaSyDP1btfiPrymhvrYepVc8u8PatdiZq01D0",
  authDomain: "minb-spanish-study.firebaseapp.com",
  projectId: "minb-spanish-study",
  storageBucket: "minb-spanish-study.firebasestorage.app",
  messagingSenderId: "130349023752",
  appId: "1:130349023752:web:5c6c3985091f58959587bd"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
db.enablePersistence({ synchronizeTabs: true }).catch(e => console.warn('오프라인 캐시 비활성:', e && e.code));

let currentUser = null;
let spaceId = null;
let spaceData = null;
let unsubSpace = null;
let selectedDate = new Date();
let editingKey = dateKey(new Date());
let selectedMood = '😊';
const MOODS = ['😊','😆','😌','😐','😢','😡','🥰','💪','😴','🤒'];
const DAYS_KO = ['일','월','화','수','목','금','토'];
let viewMonth = new Date();

function dateKey(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// ══════════════════════════════════════
// AUTH
// ══════════════════════════════════════
// 리다이렉트 로그인 복귀 시 에러 표면화 (정상 로그인은 onAuthStateChanged가 처리)
auth.getRedirectResult().catch(e => {
  if (e && e.code && e.code !== 'auth/no-auth-event') {
    console.error('리다이렉트 로그인 에러:', e);
    alert('구글 로그인 중 문제가 발생했습니다.\n코드: ' + e.code + '\n메시지: ' + e.message);
  }
});

auth.onAuthStateChanged(async (user) => {
  if (user) {
    currentUser = user;
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('userProfile').style.display = 'flex';
    document.getElementById('userName').textContent = `👤 ${user.displayName || '사용자'}`;
    await connectSpace();
  } else {
    currentUser = null;
    document.getElementById('loginOverlay').style.display = 'flex';
    document.getElementById('userProfile').style.display = 'none';
    if (unsubSpace) { unsubSpace(); unsubSpace = null; }
    resetDiaryStorage();
  }
});

async function loginWithGoogle() {
  // iOS/Android 앱(Capacitor)에서는 네이티브 구글 로그인을 사용한다
  // (웹뷰에서는 구글이 OAuth 팝업을 차단하기 때문)
  const cap = window.Capacitor;
  if (cap && cap.isNativePlatform && cap.isNativePlatform()) {
    try {
      const result = await cap.Plugins.FirebaseAuthentication.signInWithGoogle();
      const idToken = result.credential && result.credential.idToken;
      const accessToken = result.credential && result.credential.accessToken;
      if (!idToken) throw new Error('네이티브 로그인에서 토큰을 받지 못했습니다.');
      const credential = firebase.auth.GoogleAuthProvider.credential(idToken, accessToken || null);
      await auth.signInWithCredential(credential);
    } catch (e) {
      console.error('네이티브 로그인 에러:', e);
      alert('구글 로그인 중 문제가 발생했습니다.\n' + (e.message || e));
    }
    return;
  }
  const provider = new firebase.auth.GoogleAuthProvider();
  // 팝업 우선 (iOS 홈 화면 앱에서도 팝업이 리다이렉트보다 안정적)
  try {
    await auth.signInWithPopup(provider);
  } catch (e) {
    // 팝업이 차단되면 리다이렉트로 자동 전환
    if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment' || e.code === 'auth/cancelled-popup-request') {
      try { await auth.signInWithRedirect(provider); return; } catch (e2) { e = e2; }
    }
    console.error('로그인 에러:', e);
    alert(`구글 로그인 중 문제가 발생했습니다.\n코드: ${e.code}\n메시지: ${e.message}`);
  }
}
async function logout() {
  if (confirm('로그아웃 하시겠습니까?')) { await auth.signOut(); location.reload(); }
}

// ══════════════════════════════════════
// SPACE 연결 (Minb와 동일한 스페이스 사용)
// ══════════════════════════════════════
function genCode() {
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  let c = '';
  for (let i = 0; i < 6; i++) c += chars[Math.floor(Math.random()*chars.length)];
  return c;
}

async function connectSpace() {
  if (await tryFastStartFromCache()) return;
  return connectSpaceFromServer();
}

async function tryFastStartFromCache() {
  const user = currentUser;
  if (!user) return false;
  const userRef = db.collection('users').doc(user.uid);
  try {
    const cached = await userRef.get({ source: 'cache' });
    const cachedSpaceId = cached.exists ? String((cached.data() || {}).spaceId || '').trim().toUpperCase() : '';
    if (!cachedSpaceId) return false;

    spaceId = cachedSpaceId;
    subscribeSpace();
    void verifyCachedSpace(user, userRef, cachedSpaceId);
    return true;
  } catch {
    return false;
  }
}

async function verifyCachedSpace(user, userRef, cachedSpaceId) {
  try {
    const [userSnap, spaceSnap] = await Promise.all([
      userRef.get(),
      db.collection('spaces').doc(cachedSpaceId).get()
    ]);
    const serverSpaceId = userSnap.exists ? String((userSnap.data() || {}).spaceId || '').trim().toUpperCase() : '';
    const isMember = spaceSnap.exists && (spaceSnap.data().members || []).includes(user.uid);
    if (currentUser?.uid === user.uid && spaceId === cachedSpaceId && (serverSpaceId !== cachedSpaceId || !isMember)) {
      if (unsubSpace) { unsubSpace(); unsubSpace = null; }
      resetDiaryStorage();
      spaceId = null;
      spaceData = null;
      await connectSpaceFromServer();
    }
  } catch (e) {
    console.warn('캐시 스페이스 확인 실패(캐시로 계속 진행):', e && e.code);
  }
}

async function connectSpaceFromServer() {
  const userRef = db.collection('users').doc(currentUser.uid);
  const snap = await userRef.get();
  spaceId = snap.exists ? (snap.data().spaceId || null) : null;

  let loadedSpace = null;
  if (spaceId) {
    try {
      const sp = await db.collection('spaces').doc(spaceId).get();
      if (!sp.exists || !(sp.data().members || []).includes(currentUser.uid)) spaceId = null;
      else loadedSpace = sp.data();
    } catch (e) { spaceId = null; }
  }
  if (loadedSpace) applySpaceData(loadedSpace);

  if (!spaceId) {
    // Minb를 거치지 않고 처음 온 경우에도 스페이스를 만들어 준다
    spaceId = genCode();
    await db.collection('spaces').doc(spaceId).set({
      members: [currentUser.uid],
      memberProfiles: { [currentUser.uid]: { name: currentUser.displayName || '사용자', photo: currentUser.photoURL || '' } },
      days: {},
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    await userRef.set({ spaceId }, { merge: true });
  }

  subscribeSpace();
}

function subscribeSpace() {
  if (!spaceId) return;
  if (unsubSpace) unsubSpace();
  unsubSpace = db.collection('spaces').doc(spaceId).onSnapshot(doc => {
    if (!doc.exists) return;
    applySpaceData(doc.data());
  }, e => console.error('스페이스 구독 에러:', e));
}

function applySpaceData(data) {
  const hasDraft = isDirty();
  spaceData = data;
  ensureDiaryStorage();
  if (diaryMode === 'legacy') {
    // 배우자 기기가 옮기기를 마쳤으면 곧바로 새 방식으로 넘어간다(예전 위치는 이제 잠김).
    if ((data.diaryStorage || 0) >= DIARY_STORAGE_VERSION) startMonthDiary();
    else sharedDiary = data.sharedDiary || {};
  }
  renderAfterData(hasDraft);
}

function renderAfterData(hasDraft) {
  if (hasDraft) { renderList(); renderMembers(); renderPartners(); }
  else renderAll();
}

// ══════════════════════════════════════
// DATA — 교환일기는 달마다 문서 하나(spaces/{id}/diaryMonths/{YYYY-MM})에 둔다.
//   { entries: { 'YYYY-MM-DD': { uid: {text, mood, name, updatedAt} } } }
// 예전에는 스페이스 문서의 sharedDiary 한 곳에 전부 쌓여서 문서 한도(1MB)에 닿을 상황이었다.
// 예전 위치의 글은 처음 한 번 복사해 옮기고, 원본은 지우지 않고 남겨 둔다.
// 스페이스 문서 구독은 멤버 정보 때문에 계속 유지하고, 일기만 월별 문서에서 받는다.
// ══════════════════════════════════════
const DIARY_STORAGE_VERSION = 2;
let sharedDiary = {};          // 화면은 이것만 읽는다
let diaryMode = null;          // null(아직 안 정함) | 'legacy'(옮기기 실패 시) | 'months'
let diaryModeFor = null;       // 어느 스페이스 기준으로 정했는지
let unsubDiaryMonths = null;

const spaceMonthsCol = sid => db.collection('spaces').doc(sid).collection('diaryMonths');

function stopDiaryMonths() { if (unsubDiaryMonths) { unsubDiaryMonths(); unsubDiaryMonths = null; } }
function resetDiaryStorage() { stopDiaryMonths(); diaryMode = null; diaryModeFor = null; sharedDiary = {}; }

// 스페이스를 처음 받았을 때 한 번 저장 방식을 정한다. 옮기는 동안은 예전 글을 그대로 보여 준다.
function ensureDiaryStorage() {
  if (!spaceId || !spaceData || diaryModeFor === spaceId) return;
  const sid = spaceId;
  diaryModeFor = sid;
  diaryMode = 'legacy';
  sharedDiary = spaceData.sharedDiary || {};
  if ((spaceData.diaryStorage || 0) >= DIARY_STORAGE_VERSION) { startMonthDiary(); return; }
  moveSharedDiaryToMonths(sid).then(ok => {
    if (ok && spaceId === sid && diaryModeFor === sid && diaryMode === 'legacy') startMonthDiary();
  });
}

// 예전 위치 → 월별 문서로 한 번 옮긴다. 서버에서 다시 읽어 원본과 모두 맞아야 true.
// 두 사람 기기가 동시에 해도 결과가 같다(이미 있는 더 최신 글은 덮지 않는다).
async function moveSharedDiaryToMonths(sid) {
  const FieldPath = firebase.firestore.FieldPath;
  const ref = db.collection('spaces').doc(sid);
  const col = spaceMonthsCol(sid);
  const startedAt = Date.now();
  const run = async () => {
    // 기기에 남은 오래된 캐시로 옮기면 빠지는 글이 생기므로 원본은 서버에서 읽는다.
    const server = (await ref.get({ source: 'server' })).data() || {};
    if ((server.diaryStorage || 0) >= DIARY_STORAGE_VERSION) return true; // 배우자 기기가 이미 옮김
    const result = await DiaryMonths.migrate({ db, col, FieldPath, legacy: server.sharedDiary || {}, depth: 2 });
    if (!result.ok) {
      console.error('교환일기 옮기기 검증 실패 — 예전 방식을 유지하고 다음에 다시 시도합니다.', result.problems.slice(0, 5));
      return false;
    }
    // 이 표시 이후로는 보안 규칙이 예전 위치 쓰기를 막는다(업데이트 안 된 화면이 조용히 어긋나지 않게).
    await ref.update({ diaryStorage: DIARY_STORAGE_VERSION, diaryMovedAt: startedAt });
    // 표시 직전 몇 초 사이에 배우자의 예전 화면이 쓴 글이 있으면 마저 옮긴다.
    try {
      const fresh = (await ref.get({ source: 'server' })).data() || {};
      await DiaryMonths.catchUp({ db, col, FieldPath, legacy: fresh.sharedDiary || {}, depth: 2,
        since: startedAt - 10 * 60 * 1000 });
    } catch (e) { console.warn('옮긴 직후 확인을 건너뜀(원본은 그대로 남아 있음):', e && (e.code || e.message)); }
    if (result.copied) console.info(`교환일기 ${result.copied}편을 월별 저장소로 옮겼어요.`);
    return true;
  };
  try {
    return await DiaryMonths.withTimeout(run(), 30000, '교환일기 옮기기');
  } catch (e) {
    console.warn('이번엔 교환일기를 옮기지 못했어요 — 예전 방식으로 열고 다음에 다시 시도합니다:', e && (e.code || e.message));
    return false;
  }
}

// 실시간 구독 — 배우자가 쓴 일기도 즉시 반영. 바뀐 달의 문서만 새로 받는다.
function startMonthDiary() {
  const sid = spaceId;
  if (!sid) return;
  diaryMode = 'months';
  diaryModeFor = sid;
  stopDiaryMonths();
  unsubDiaryMonths = spaceMonthsCol(sid).onSnapshot(snap => {
    if (spaceId !== sid) return;
    const hasDraft = isDirty();
    sharedDiary = DiaryMonths.mergeMonths(snap.docs.map(d => d.data()));
    renderAfterData(hasDraft);
  }, e => console.error('교환일기 구독 에러:', e));
}

// 내 글 하나를 통째로 저장한다. 월별 문서에서는 그날의 '내 칸'만 정확히 갈아 끼워
// 같은 날 배우자 글은 절대 건드리지 않는다.
function writeSharedEntry(sid, key, uid, entry) {
  const ref = db.collection('spaces').doc(sid);
  if (diaryMode === 'months') {
    const FieldPath = firebase.firestore.FieldPath;
    return spaceMonthsCol(sid).doc(DiaryMonths.monthOf(key))
      .set({ entries: { [key]: { [uid]: entry } } }, { mergeFields: [new FieldPath('entries', key, uid)] });
  }
  return ref.update({ [`sharedDiary.${key}.${uid}`]: entry, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
}

function removeSharedEntry(sid, key, uid) {
  if (diaryMode === 'months') {
    return spaceMonthsCol(sid).doc(DiaryMonths.monthOf(key))
      .update(new firebase.firestore.FieldPath('entries', key, uid), firebase.firestore.FieldValue.delete());
  }
  return db.collection('spaces').doc(sid).update({ [`sharedDiary.${key}.${uid}`]: firebase.firestore.FieldValue.delete() });
}

function getEntries(key) {
  return sharedDiary[key] || {};
}
function myEntry(key) { return currentUser ? getEntries(key)[currentUser.uid] : null; }

function isDirty() {
  const cur = document.getElementById('diaryArea').value.trim();
  const mine = myEntry(editingKey);
  return cur !== ((mine && mine.text) || '').trim();
}

let diarySavePending = false;
async function notifyNewSharedDiary(user, savedSpaceId, dayKey) {
  try {
    const token = await user.getIdToken();
    const response = await fetch('https://asia-northeast3-minb-spanish-study.cloudfunctions.net/notifySharedDiaryEntry', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
      body: JSON.stringify({ data: { spaceId: savedSpaceId, dayKey } })
    });
    if (!response.ok) throw new Error('notification-request-failed');
  } catch {
    if (currentUser?.uid === user.uid) toast('일기는 저장됐지만 알림 요청을 보내지 못했어요.');
  }
}
async function saveEntry() {
  if (!currentUser || !spaceId || !spaceData || diarySavePending) return;
  const text = document.getElementById('diaryArea').value.trim();
  if (!text) { toast('내용을 입력해 주세요 ✍️'); return; }
  const user = currentUser, savedSpaceId = spaceId, dayKey = editingKey;
  const firstSave = !myEntry(dayKey);
  const entry = {
    text, mood: selectedMood,
    name: user.displayName || '사용자', photo: user.photoURL || '', updatedAt: Date.now()
  };
  diarySavePending = true;
  const modeAtSave = diaryMode; // 실패 이유는 '저장을 시작한 때'의 방식으로 판단한다
  const button = document.querySelector('button[onclick="saveEntry()"]');
  button.disabled = true; button.textContent = '저장 중…';
  try {
    await writeSharedEntry(savedSpaceId, dayKey, user.uid, entry);
    if (currentUser?.uid === user.uid && spaceId === savedSpaceId) {
      const draftText = document.getElementById('diaryArea').value, draftMood = selectedMood;
      const keepDraft = editingKey !== dayKey ? isDirty() : draftText.trim() !== text || draftMood !== entry.mood;
      if (!sharedDiary[dayKey]) sharedDiary[dayKey] = {};
      sharedDiary[dayKey][user.uid] = entry;
      document.getElementById('saveHint').textContent = '저장됨';
      setTimeout(() => document.getElementById('saveHint').textContent = '', 2000);
      renderAll();
      if (keepDraft) { document.getElementById('diaryArea').value = draftText; selectedMood = draftMood; renderMoodRow(); updateCharCount(); }
      toast('교환일기가 저장됐어요!');
      if (firstSave) void notifyNewSharedDiary(user, savedSpaceId, dayKey);
    }
  } catch (e) {
    console.error('저장 실패:', e);
    if (e && e.code === 'permission-denied' && modeAtSave === 'legacy') {
      // 배우자 기기가 저장 방식을 바꿔 예전 위치가 잠겼다. 새 방식으로 다시 연결한다(쓰던 글은 그대로).
      toast('저장 방식이 바뀌었어요. 잠시 후 한 번 더 저장해 주세요.');
      if (diaryMode === 'legacy') { diaryModeFor = null; ensureDiaryStorage(); } // 아직 전환 소식을 못 받았으면 직접
    } else {
      toast('저장에 실패했어요. 입력한 내용은 그대로예요.');
    }
  }
  finally { diarySavePending = false; button.disabled = false; button.textContent = '저장하기'; }
}

async function deleteEntry() {
  if (!myEntry(editingKey)) return;
  if (!confirm('이 날의 내 일기를 삭제할까요? 되돌릴 수 없어요.')) return;
  if (sharedDiary[editingKey]) delete sharedDiary[editingKey][currentUser.uid];
  try {
    await removeSharedEntry(spaceId, editingKey, currentUser.uid);
    renderAll();
    toast('일기를 삭제했어요.');
  } catch (e) { console.error('삭제 실패:', e); toast('삭제에 실패했어요.'); }
}

// ══════════════════════════════════════
// 날짜 이동
// ══════════════════════════════════════
function guardDirty() {
  if (isDirty() && !confirm('저장하지 않은 일기 내용이 있어요.\n저장 없이 이동하면 사라집니다. 이동할까요?')) return false;
  return true;
}
function moveDate(delta) {
  if (!guardDirty()) return;
  selectedDate.setDate(selectedDate.getDate() + delta);
  editingKey = dateKey(selectedDate);
  renderAll();
}
function goToday() {
  if (!guardDirty()) return;
  selectedDate = new Date();
  editingKey = dateKey(selectedDate);
  renderAll();
}
function onDatePick(v) {
  if (!v) return;
  if (!guardDirty()) { document.getElementById('datePicker').value = editingKey; return; }
  const [y,m,d] = v.split('-').map(Number);
  selectedDate = new Date(y, m-1, d);
  editingKey = dateKey(selectedDate);
  renderAll();
}
function moveMonth(delta) { viewMonth.setMonth(viewMonth.getMonth() + delta); renderList(); }

// ══════════════════════════════════════
// RENDER
// ══════════════════════════════════════
function renderAll() {
  const isToday = editingKey === dateKey(new Date());
  document.getElementById('heroDate').textContent =
    `${selectedDate.getMonth()+1}월 ${selectedDate.getDate()}일 (${DAYS_KO[selectedDate.getDay()]})${isToday ? ' · 오늘' : ''}`;
  document.getElementById('datePicker').value = editingKey;

  renderMembers();
  renderPartners();
  renderEditor();
  renderList();
}

function renderMembers() {
  const box = document.getElementById('memberChips');
  if (!spaceData) { box.innerHTML = ''; return; }
  const profiles = spaceData.memberProfiles || {};
  const members = spaceData.members || [];
  box.innerHTML = members.map(uid => {
    const p = profiles[uid] || { name: '멤버', photo: '' };
    const img = p.photo ? `<img src="${esc(p.photo)}" alt="" referrerpolicy="no-referrer">` : '👤';
    const me = currentUser && uid === currentUser.uid ? ' (나)' : '';
    return `<span class="member-chip">${img} ${esc(p.name)}${me}</span>`;
  }).join('');
  document.getElementById('soloHint').style.display = members.length > 1 ? 'none' : 'block';
}

// 카드 제목에 쓸 상대방 이름. 스페이스 멤버 프로필이 기준이고,
// 프로필이 아직 안 올라온 경우엔 그 날 일기에 담긴 이름으로 대신한다.
function partnerNames(entries) {
  const profiles = (spaceData && spaceData.memberProfiles) || {};
  const members = (spaceData && spaceData.members) || [];
  const isOther = uid => !currentUser || uid !== currentUser.uid;
  const uids = members.filter(isOther);
  const source = uids.length ? uids : Object.keys(entries || {}).filter(isOther);
  return source.map(uid =>
    (profiles[uid] && profiles[uid].name) || (entries && entries[uid] && entries[uid].name) || '멤버'
  );
}

function renderPartners() {
  const box = document.getElementById('partnerEntries');
  const entries = getEntries(editingKey);
  const others = Object.keys(entries).filter(uid => !currentUser || uid !== currentUser.uid);

  const names = partnerNames(entries);
  const label = names.length ? names.join('·') : '상대방';
  document.getElementById('partnerLabel').textContent = label;

  if (!others.length) {
    box.innerHTML = `<div class="empty-msg">${esc(label)}의 일기가 아직 없어요 🕊</div>`;
    return;
  }
  box.innerHTML = others.map(uid => {
    const e = entries[uid];
    const img = e.photo ? `<img src="${esc(e.photo)}" alt="" referrerpolicy="no-referrer">` : '👤';
    const t = e.updatedAt ? new Date(e.updatedAt) : null;
    const time = t ? `${t.getMonth()+1}/${t.getDate()} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')} 작성` : '';
    return `<div class="partner-entry">
      <div class="partner-head">${img} <span>${e.mood || '📝'} ${esc(e.name || '멤버')}</span></div>
      <div class="partner-text">${esc(e.text)}</div>
      <div class="partner-time">${time}</div>
    </div>`;
  }).join('');
}

function renderEditor() {
  const mine = myEntry(editingKey);
  document.getElementById('diaryArea').value = mine ? mine.text : '';
  selectedMood = (mine && mine.mood) || MOODS[0];
  document.getElementById('deleteBtn').style.display = mine ? 'inline-block' : 'none';
  renderMoodRow();
  updateCharCount();
}

function renderMoodRow() {
  document.getElementById('moodRow').innerHTML = MOODS.map(m =>
    `<button class="mood-btn ${m === selectedMood ? 'active' : ''}" onclick="pickMood('${m}')">${m}</button>`
  ).join('');
}
function pickMood(m) { selectedMood = m; renderMoodRow(); }
function updateCharCount() {
  document.getElementById('charCount').textContent = `${document.getElementById('diaryArea').value.length}자`;
}

function renderList() {
  const y = viewMonth.getFullYear(), m = viewMonth.getMonth();
  document.getElementById('monthLabel').textContent = `${y}년 ${m+1}월`;
  const prefix = `${y}-${String(m+1).padStart(2,'0')}`;
  const all = sharedDiary;
  const keys = Object.keys(all)
    .filter(k => k.startsWith(prefix) && Object.keys(all[k]).length)
    .sort().reverse();
  const box = document.getElementById('entryList');
  if (!keys.length) {
    box.innerHTML = '<div class="empty-msg">이 달에는 아직 교환일기가 없어요.<br>오른쪽에서 첫 일기를 남겨보세요 💌</div>';
    return;
  }
  box.innerHTML = keys.map(k => {
    const entries = all[k];
    const uids = Object.keys(entries);
    const [yy,mm,dd] = k.split('-').map(Number);
    const day = DAYS_KO[new Date(yy, mm-1, dd).getDay()];
    const moods = uids.map(u => entries[u].mood || '📝').join(' ');
    const names = uids.map(u => esc((entries[u].name || '멤버').split(' ')[0])).join(', ');
    const firstText = entries[uids[0]].text || '';
    return `<div class="entry-item ${k === editingKey ? 'selected' : ''}" onclick="goDate('${k}')">
      <div class="entry-head">
        <span>${moods}</span>
        <span class="entry-date">${mm}월 ${dd}일 (${day})</span>
        <span class="entry-authors">${names}</span>
      </div>
      <div class="entry-preview">${esc(firstText)}</div>
    </div>`;
  }).join('');
}

function goDate(k) {
  if (!guardDirty()) return;
  const [y,m,d] = k.split('-').map(Number);
  selectedDate = new Date(y, m-1, d);
  editingKey = k;
  renderAll();
}

// ══════════════════════════════════════
// THEME / TOAST
// ══════════════════════════════════════
function toggleTheme() {
  const isDark = document.body.classList.toggle('dark');
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
  updateThemeButton();
}
function updateThemeButton() {
  document.getElementById('themeToggle').innerHTML = document.body.classList.contains('dark') ? '☀️ 라이트' : '🌙 다크';
}
function loadTheme() {
  if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');
  updateThemeButton();
}

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

// ══════════════════════════════════════
// 다시 들어왔을 때 오늘로 되돌리기
// ══════════════════════════════════════
// 앱(웹뷰)은 백그라운드로 보내도 페이지가 그대로 살아 있어서, 며칠 뒤 다시 열면
// 마지막으로 일기를 쓰던 날짜가 그대로 남아 있었다. 잠깐 앱을 전환한 정도가 아니라
// 실제로 '다시 들어온' 경우에만 오늘 날짜로 되돌린다.
// 저장하지 않은 초안이 있으면 날짜를 옮기지 않는다(내용이 사라지므로).
const RETURN_AFTER_MS = 60 * 1000;
let hiddenAt = 0;

function jumpToTodayOnReturn() {
  if (editingKey === dateKey(new Date())) return;
  if (isDirty()) return;
  selectedDate = new Date();
  editingKey = dateKey(selectedDate);
  viewMonth = new Date();
  renderAll();
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (hiddenAt && Date.now() - hiddenAt >= RETURN_AFTER_MS) jumpToTodayOnReturn();
  hiddenAt = 0;
});
// 뒤로가기 등으로 살아 있던 페이지가 복원된 경우
window.addEventListener('pageshow', e => { if (e.persisted) jumpToTodayOnReturn(); });

loadTheme();
renderMoodRow();
renderAll();
</script>
</body>
</html>
