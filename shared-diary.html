<style>
  :root {
    --red: #d32f2f;
    --red-light: #fdf2f2;
    --dark: #1e1e24;
    --card: #ffffff;
    --bg: #fcf9f5;
    --text: #2c2c35;
    --muted: #70757f;
    --border: #e9e2d9;
    --green: #2e7d32;
    --green-light: #e8f5e9;
    --blue: #1565c0;
    --blue-light: #e3f2fd;
    --rose: #c2185b;
    --rose-dark: #880e4f;
    --rose-light: #fce4ec;

    --radius: 16px;
    --shadow: 0 4px 18px rgba(0, 0, 0, 0.05);
    --shadow-hover: 0 8px 30px rgba(194, 24, 91, 0.12);
    --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  body.dark {
    --bg: #121214;
    --card: #1e1e24;
    --text: #e1e1e6;
    --muted: #a1a1aa;
    --border: #2e2e35;
    --red-light: rgba(211, 47, 47, 0.15);
    --green-light: rgba(46, 125, 50, 0.15);
    --blue-light: rgba(21, 101, 192, 0.15);
    --rose-light: rgba(194, 24, 91, 0.18);
    --shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
    --shadow-hover: 0 8px 32px rgba(0, 0, 0, 0.4);
    --dark: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Outfit', 'Noto Sans KR', sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    transition: var(--transition);
  }

  header {
    background: linear-gradient(135deg, var(--rose) 0%, var(--rose-dark) 100%);
    color: white; position: sticky; top: 0; z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  }
  .header-top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px; flex-wrap: wrap; gap: 12px;
    max-width: 1060px; margin: 0 auto;
  }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-flag { font-size: 32px; }
  .logo-text h1 { font-size: 18px; font-weight: 800; }
  .logo-text p { font-size: 12px; opacity: 0.75; margin-top: 3px; }
  .header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .hbtn {
    background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25);
    color: white; padding: 6px 14px; border-radius: 20px;
    font-size: 12px; font-weight: 600; cursor: pointer;
    text-decoration: none; transition: var(--transition);
    display: inline-flex; align-items: center; gap: 6px; font-family: inherit;
  }
  .hbtn:hover { background: rgba(255,255,255,0.28); transform: translateY(-1px); }
  .profile-badge {
    background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3);
    color: white; padding: 5px 12px; border-radius: 20px;
    font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 8px;
  }
  .logout-btn {
    background: none; border: none; color: rgba(255,255,255,0.85); cursor: pointer;
    font-size: 11px; text-decoration: underline; font-weight: 600;
    padding-left: 4px; border-left: 1px solid rgba(255,255,255,0.3);
  }

  main { max-width: 1020px; margin: 28px auto; padding: 0 20px; }
  .grid { display: grid; grid-template-columns: 0.9fr 1.1fr; gap: 18px; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow);
  }
  .card-title { font-size: 15px; font-weight: 800; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }

  @keyframes fadeIn { from { opacity:0; transform: translateY(8px);} to {opacity:1; transform:translateY(0);} }
  .fade { animation: fadeIn 0.4s ease; }

  /* ── 날짜 히어로 ── */
  .hero {
    background: linear-gradient(135deg, var(--rose), #e91e63);
    color: white; border-radius: var(--radius); padding: 22px 26px;
    margin-bottom: 18px; box-shadow: var(--shadow);
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px;
  }
  .hero h2 { font-size: 20px; font-weight: 900; }
  .hero .sub { font-size: 12.5px; opacity: 0.85; margin-top: 5px; }
  .date-nav { display: flex; align-items: center; gap: 8px; }
  .date-nav button {
    background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
    color: white; width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
    font-size: 15px; font-weight: 700; transition: var(--transition);
  }
  .date-nav button:hover { background: rgba(255,255,255,0.3); }
  .date-nav .today-btn { width: auto; border-radius: 18px; padding: 0 14px; font-size: 12px; }
  .date-nav input[type="date"] {
    background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
    color: white; padding: 6px 10px; border-radius: 10px; font-family: inherit;
    font-size: 13px; font-weight: 600; color-scheme: dark;
  }

  /* ── 멤버 글 카드 ── */
  .partner-entry {
    border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px;
    background: var(--rose-light);
  }
  .partner-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 13px; font-weight: 800; }
  .partner-head img { width: 22px; height: 22px; border-radius: 50%; }
  .partner-text { font-size: 14px; line-height: 1.8; white-space: pre-wrap; word-break: break-all; }
  .partner-time { font-size: 11px; color: var(--muted); margin-top: 8px; text-align: right; }

  /* ── 에디터 ── */
  .mood-row { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .mood-btn {
    background: var(--bg); border: 1.5px solid var(--border); border-radius: 12px;
    font-size: 20px; padding: 6px 10px; cursor: pointer; transition: var(--transition);
  }
  .mood-btn:hover { transform: scale(1.12); }
  .mood-btn.active { border-color: var(--rose); background: var(--rose-light); }
  .diary-area {
    width: 100%; min-height: 220px; background: var(--bg);
    border: 1.5px solid var(--border); border-radius: 12px; padding: 14px;
    font-size: 14.5px; color: var(--text); font-family: inherit; line-height: 1.9;
    resize: vertical; outline: none; transition: var(--transition);
  }
  .diary-area:focus { border-color: var(--rose); }
  .editor-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; gap: 10px; }
  .char-count { font-size: 12px; color: var(--muted); }
  .primary-btn {
    background: var(--rose); color: white; border: none; border-radius: 12px;
    padding: 10px 22px; font-size: 13.5px; font-weight: 700; cursor: pointer;
    font-family: inherit; transition: var(--transition);
  }
  .primary-btn:hover { filter: brightness(1.12); }
  .ghost-btn {
    background: none; border: 1.5px solid var(--border); border-radius: 12px;
    padding: 10px 16px; font-size: 13px; font-weight: 700; color: var(--muted);
    cursor: pointer; font-family: inherit; transition: var(--transition);
  }
  .ghost-btn:hover { color: var(--red); border-color: var(--red); }
  .save-hint { font-size: 11.5px; color: var(--green); font-weight: 700; }

  /* ── 목록 ── */
  .month-nav { display: flex; align-items: center; gap: 12px; }
  .month-nav button {
    background: var(--bg); border: 1.5px solid var(--border); border-radius: 8px;
    width: 28px; height: 28px; cursor: pointer; color: var(--text); font-weight: 700;
  }
  .month-nav .label { font-size: 14px; font-weight: 800; min-width: 90px; text-align: center; }
  .entry-item {
    border: 1px solid var(--border); border-radius: 12px; padding: 13px 15px;
    margin-bottom: 10px; cursor: pointer; transition: var(--transition);
  }
  .entry-item:hover { border-color: var(--rose); box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .entry-item.selected { border-color: var(--rose); background: var(--rose-light); }
  .entry-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .entry-date { font-size: 13px; font-weight: 800; }
  .entry-authors { margin-left: auto; font-size: 11.5px; color: var(--muted); }
  .entry-preview { font-size: 12.5px; color: var(--muted); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-all; }
  .empty-msg { color: var(--muted); font-size: 13px; text-align: center; padding: 26px 0; line-height: 1.7; }

  .member-chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .member-chip {
    display: inline-flex; align-items: center; gap: 7px; background: var(--rose-light);
    border: 1px solid var(--border); padding: 5px 12px; border-radius: 16px; font-size: 12.5px; font-weight: 700;
  }
  .member-chip img { width: 20px; height: 20px; border-radius: 50%; }

  /* ── 로그인 오버레이 ── */
  #loginOverlay {
    position: fixed; inset: 0; background: rgba(18, 18, 20, 0.6);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    z-index: 1000; display: flex; align-items: center; justify-content: center;
  }
  .login-card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    max-width: 420px; width: 90%; text-align: center; padding: 40px 28px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.3);
  }
  .google-btn {
    background: var(--rose); color: white; border: none; padding: 14px 28px;
    border-radius: 28px; font-size: 15px; font-weight: 700; cursor: pointer; width: 100%;
    transition: var(--transition); display: flex; align-items: center; justify-content: center; gap: 10px;
    font-family: inherit;
  }

  #toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--dark); color: var(--card); padding: 12px 24px; border-radius: 24px;
    font-size: 13px; font-weight: 700; z-index: 2000; opacity: 0; transition: all 0.35s ease;
    pointer-events: none; box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  }
  body.dark #toast { background: #e1e1e6; color: #1e1e24; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.diary-area, .prompt-text { word-break:keep-all; overflow-wrap:break-word; }
</style>

<div id="loginOverlay" style="display:none;">
  <div class="login-card">
    <h2 style="font-size: 22px; font-weight: 900; margin-bottom: 8px; color: var(--dark);">교환일기</h2>
    <p style="font-size: 13.5px; color: var(--muted); margin-bottom: 28px; line-height: 1.6;">
      스페이스를 함께 쓰는 사람과 날짜별로<br>일기를 주고받아요. 구글 로그인이 필요합니다.
    </p>
    <button onclick="loginWithGoogle()" class="google-btn">
      <svg style="width:18px; height:18px; fill:currentColor" viewBox="0 0 24 24"><path d="M12.24 10.285V14.4h6.887c-.648 2.41-2.519 4.114-5.136 4.114-3.513 0-6.386-2.87-6.386-6.385s2.87-6.386 6.386-6.386c1.61 0 3.076.61 4.2 1.61l3.053-3.053C19.16 2.457 15.903 1 12.24 1c-6.077 0-11 4.923-11 11s4.923 11 11 11c5.962 0 10.884-4.854 10.884-11 0-.693-.077-1.37-.216-2.03H12.24z"/></svg>
      Google 계정으로 시작하기
    </button>

</div>

<header>
  <div class="header-top">
    <div class="logo">
      <img class="logo-flag" src="favicon.svg" alt="" width="36" height="36">
      <div class="logo-text">
        <h1>교환일기</h1>
        <p>서로의 하루를 읽는 곳</p>
      </div>
    </div>
    <div class="header-right">
      <a href="./" class="hbtn">Minb</a>

        <button onclick="logout()" class="logout-btn">로그아웃</button>

<main class="fade">
<div class="diary-sync" id="diarySyncPanel" hidden><p id="diarySyncStatus" role="status" aria-live="polite"></p><button class="ui-button" id="diarySyncRetry" type="button" onclick="retryDiarySync()" hidden>다시 연결</button></div>

  <div class="hero">

    <div class="date-nav">
      <button onclick="moveDate(-1)">‹</button>
      <input type="date" id="datePicker" onchange="onDatePick(this.value)">

      <button class="today-btn" onclick="goToday()">오늘</button>

  <!-- 상대방이 써준 일기: 페이지를 열자마자 가장 먼저 읽히도록 맨 위에 둔다 -->
  <div class="card" style="margin-bottom: 18px;">
    <div class="card-title"><span><span id="partnerLabel">멤버</span>의 일기</span></div>
    <div id="partnerEntries"></div>
  </div>

  <div class="card" style="margin-bottom: 18px;">
    <div class="card-title"><span>함께 쓰는 사람</span></div>
    <div class="member-chips" id="memberChips"></div>

      함께 쓸 사람을 초대해 보세요. <a href="./" style="color: var(--rose); font-weight: 700;">Minb</a>에서 초대 코드를 공유하면 함께 쓸 수 있어요.

  <div class="grid">

    <div class="card">
      <div class="card-title">
        <span>일기 목록</span>

          <button onclick="moveMonth(-1)">‹</button>
          <span class="label" id="monthLabel"></span>
          <button onclick="moveMonth(1)">›</button>

    <!-- 이 날 내가 쓰는 일기 -->

<script>
// ══════════════════════════════════════
// FIREBASE INIT
// ══════════════════════════════════════
const firebaseConfig = {
  apiKey: "AIzaSyDP1btfiPrymhvrYepVc8u8PatdiZq01D0",
  authDomain: "minb-spanish-study.firebaseapp.com",
  projectId: "minb-spanish-study",
  storageBucket: "minb-spanish-study.firebasestorage.app",
  messagingSenderId: "130349023752",
  appId: "1:130349023752:web:5c6c3985091f58959587bd"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
db.enablePersistence({ synchronizeTabs: true }).catch(e => console.warn('오프라인 캐시 비활성:', e && e.code));

let currentUser = null;
let spaceId = null;
let spaceData = null;
let unsubSpace = null;
let selectedDate = new Date();
let editingKey = dateKey(new Date());
let selectedMood = '😊';
const MOODS = ['😊','😆','😌','😐','😢','😡','🥰','💪','😴','🤒'];
const DAYS_KO = ['일','월','화','수','목','금','토'];
let viewMonth = new Date();

function dateKey(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

// ══════════════════════════════════════
// AUTH
// ══════════════════════════════════════
// 리다이렉트 로그인 복귀 시 에러 표면화 (정상 로그인은 onAuthStateChanged가 처리)
auth.getRedirectResult().catch(e => {
  if (e && e.code && e.code !== 'auth/no-auth-event') {
    console.error('리다이렉트 로그인 에러:', e);
    alert('구글 로그인 중 문제가 발생했습니다.\n코드: ' + e.code + '\n메시지: ' + e.message);
  }
});

let sharedStorage = null;
let sharedSession = 0;
let connectionAttempt = 0;
let subscriptionRevision = 0;
let sharedBaseline = {text:'', mood:'😊'};
let diarySavePending = false;
let sharedOperation = null;

function sharedEditorValue() {
  return {text:document.getElementById('diaryArea').value, mood:selectedMood};
}
function sameSharedContent(a, b) {
  return (a?.text || '').trim() === (b?.text || '').trim() && (a?.mood || MOODS[0]) === (b?.mood || MOODS[0]);
}
function sharedDraftKey(uid = currentUser?.uid, id = spaceId) {
  return uid && id ? `minb-shared-drafts:${uid}:${id}` : null;
}
function readSharedDrafts(uid = currentUser?.uid, id = spaceId) {
  const key = sharedDraftKey(uid, id);
  if (!key) return {days:{}};
  try {
    const stored = JSON.parse(localStorage.getItem(key));
    return stored?.days && typeof stored.days === 'object' ? stored : {days:{}};
  } catch { return {days:{}}; }
}
function writeSharedDrafts(drafts, uid = currentUser?.uid, id = spaceId) {
  const key = sharedDraftKey(uid, id);
  if (!key) return true;
  try { localStorage.setItem(key, JSON.stringify(drafts)); return true; }
  catch {
    document.getElementById('saveHint').textContent = '기기에 임시 저장하지 못했어요. 이동 전에 저장해 주세요.';
    return false;
  }
}
function persistSharedDraft() {
  if (!currentUser || !spaceId || !spaceData) return true;
  const drafts = readSharedDrafts();
  if (isDirty()) { drafts.days[editingKey] = {...sharedEditorValue(), updatedAt:Date.now()}; drafts.lastKey = editingKey; }
  else {
    delete drafts.days[editingKey];
    if (drafts.lastKey === editingKey) delete drafts.lastKey;
  }
  return writeSharedDrafts(drafts);
}
function clearSharedDraft(key, expected, uid = currentUser?.uid, id = spaceId) {
  const drafts = readSharedDrafts(uid, id), draft = drafts.days[key];
  if (!draft || expected && !sameSharedContent(draft, expected)) return;
  delete drafts.days[key];
  if (drafts.lastKey === key) delete drafts.lastKey;
  writeSharedDrafts(drafts, uid, id);
}
function updateSharedActions() {
  const ready = !!currentUser && !!spaceId && !!spaceData;
  const save = document.querySelector('button[onclick="saveEntry()"]');
  save.disabled = !ready || !!sharedOperation;
  save.textContent = sharedOperation?.kind === 'save' ? '저장 중…' : '저장하기';
  const remove = document.getElementById('deleteBtn');
  remove.disabled = !ready || !!sharedOperation;
  remove.textContent = sharedOperation?.kind === 'delete' ? '삭제 중…' : '삭제';
  remove.style.display = myEntry(editingKey) ? 'inline-block' : 'none';
  document.getElementById('diaryArea').disabled = !ready;
  document.querySelectorAll('#moodRow button').forEach(button => button.disabled = !ready);
}
function activateSharedSpace(id, data) {
  if (spaceId !== id) {
    persistSharedDraft();
    spaceId = id;
    spaceData = data;
    sharedBaseline = {text:'', mood:MOODS[0]};
    const drafts = readSharedDrafts();
    if (/^\d{4}-\d{2}-\d{2}$/.test(drafts.lastKey || '') && drafts.days[drafts.lastKey]) {
      editingKey = drafts.lastKey;
      const [y,m,d] = editingKey.split('-').map(Number);
      selectedDate = new Date(y,m-1,d);
      viewMonth = new Date(y,m-1,1);
    }
    renderAll();
  } else applySpaceData(data);
  updateSharedActions();
}

auth.onAuthStateChanged(async user => {
  persistSharedDraft();
  sharedStorage?.stop();
  sharedStorage = null;
  sharedSession++;
  connectionAttempt++;
  subscriptionRevision++;
  if (unsubSpace) { unsubSpace(); unsubSpace = null; }
  currentUser = user;
  spaceId = null;
  spaceData = null;
  sharedBaseline = {text:'', mood:MOODS[0]};
  sharedOperation = null;
  diarySavePending = false;
  selectedDate = new Date(); editingKey = dateKey(selectedDate); viewMonth = new Date();
  renderAll(); updateSharedActions();
  document.getElementById('loginOverlay').style.display = user ? 'none' : 'flex';
  document.getElementById('userProfile').style.display = user ? 'flex' : 'none';
  if (!user) { setDiarySync('signed-out'); return; }
  document.getElementById('userName').textContent = `${user.displayName || '사용자'}`;
  await connectSpace();
});

function genCode() {
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  let c = '';
  for (let i = 0; i < 6; i++) c += chars[Math.floor(Math.random() * chars.length)];
  return c;
}
async function connectSpace() {
  if (!currentUser) return;
  const user = currentUser, session = sharedSession, attempt = ++connectionAttempt;
  const current = () => session === sharedSession && attempt === connectionAttempt;
  setDiarySync('loading');
  try {
    const userRef = db.collection('users').doc(user.uid), snap = await userRef.get();
    if (!current()) return;
    let id = snap.exists ? snap.data().spaceId : null;
    let data;
    if (id) {
      const space = await db.collection('spaces').doc(id).get();
      if (!current()) return;
      if (!space.exists || !(space.data().members || []).includes(user.uid)) throw new Error('space-unavailable');
      if (space.metadata?.hasPendingWrites) throw new Error('space-write-unconfirmed');
      data = space.data();
    } else {
      // An unavailable network must never be interpreted as a request to replace a shared space.
      if (!navigator.onLine || snap.metadata?.fromCache) throw new Error('space-offline');
      id = genCode();
      data = {members:[user.uid], memberProfiles:{[user.uid]:{name:user.displayName || '사용자',photo:''}}, days:{},
        createdAt:firebase.firestore.FieldValue.serverTimestamp(), updatedAt:firebase.firestore.FieldValue.serverTimestamp()};
      await db.collection('spaces').doc(id).set(data);
      if (!current()) return;
      await userRef.set({spaceId:id}, {merge:true});
      if (!current()) return;
    }
    activateSharedSpace(id, data);
    subscribeSpace();
  } catch (error) {
    if (!current()) return;
    console.error('공유 공간 연결 실패:', error);
    setDiarySync('error');
    updateSharedActions();
  }
}
function retryDiarySync() {
  if (!currentUser) return;
  persistSharedDraft();
  if (unsubSpace) { unsubSpace(); unsubSpace = null; }
  subscriptionRevision++;
  return connectSpace();
}
function subscribeSpace() {
  if (!currentUser || !spaceId) return;
  if (unsubSpace) unsubSpace();
  sharedStorage?.stop();
  const session = sharedSession, id = spaceId, revision = ++subscriptionRevision;
  const current = () => session === sharedSession && id === spaceId && revision === subscriptionRevision;
  sharedStorage = createDiaryStorage({db, ref:db.collection('spaces').doc(id), field:'sharedDiary', depth:2,
    current, observe:observeDiarySnapshot, fail:() => setDiarySync('error'),
    receive:map => applySpaceData({...spaceData, sharedDiary:map})});
  unsubSpace = db.collection('spaces').doc(id).onSnapshot({includeMetadataChanges:true}, doc => {
    if (!current()) return;
    if (!doc.exists) { setDiarySync('error'); return; }
    if (doc.metadata?.hasPendingWrites) return;
    const data = doc.data();
    spaceData = {...data, sharedDiary:spaceData?.sharedDiary || {}};
    renderMembers();
    sharedStorage.read(data, doc);
  }, error => {
    if (!current()) return;
    console.error('스페이스 구독 에러:', error);
    setDiarySync('error');
  });
}
function applySpaceData(data) {
  const hasDraft = isDirty();
  spaceData = data;
  if (hasDraft || sharedOperation) { renderList(); renderMembers(); renderPartners(); }
  else renderAll();
  updateSharedActions();
}
function getEntries(key) { return (spaceData && spaceData.sharedDiary && spaceData.sharedDiary[key]) || {}; }
function myEntry(key) { return currentUser ? getEntries(key)[currentUser.uid] : null; }
function isDirty() { return !sameSharedContent(sharedEditorValue(), sharedBaseline); }

async function notifyNewSharedDiary(user, savedSpaceId, dayKey) {
  try {
    const token = await user.getIdToken();
    const response = await fetch('https://asia-northeast3-minb-spanish-study.cloudfunctions.net/notifySharedDiaryEntry', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
      body: JSON.stringify({ data: { spaceId: savedSpaceId, dayKey } })
    });
    if (!response.ok) throw new Error('notification-request-failed');
  } catch {
    if (currentUser?.uid === user.uid) toast('일기는 저장됐지만 알림 요청을 보내지 못했어요.');
  }
}
async function saveEntry() {
  if (!currentUser || !spaceId || !spaceData || sharedOperation) return;
  const value = sharedEditorValue(), text = value.text.trim();
  if (!text) { toast('내용을 입력해 주세요.'); return; }
  const user = currentUser, id = spaceId, key = editingKey, session = sharedSession;
  const firstSave = !myEntry(key), operation = {kind:'save'};
  const entry = {...value, text, name:user.displayName || '사용자', photo:user.photoURL || '', updatedAt:Date.now()};
  sharedOperation = operation; diarySavePending = true;
  persistSharedDraft(); updateSharedActions(); setDiarySync('pending');
  document.getElementById('saveHint').textContent = '저장 중…';
  try {
    await sharedStorage.write(key, entry, user.uid);
    if (session !== sharedSession || id !== spaceId) return;
    if (!spaceData.sharedDiary) spaceData.sharedDiary = {};
    if (!spaceData.sharedDiary[key]) spaceData.sharedDiary[key] = {};
    spaceData.sharedDiary[key][user.uid] = entry;
    if (editingKey === key) {
      sharedBaseline = {text:entry.text,mood:entry.mood};
      if (persistSharedDraft()) document.getElementById('saveHint').textContent = isDirty() ? '저장 후 변경한 내용이 있어요.' : '저장됨';
    } else clearSharedDraft(key, entry, user.uid, id);
    renderList(); renderMembers(); renderPartners();
    toast('교환일기가 저장됐어요.');
    if (firstSave) void notifyNewSharedDiary(user, id, key);
  } catch (error) {
    console.error('저장 실패:', error);
    if (session === sharedSession && id === spaceId) {
      if (error.code === 'permission-denied') void retryDiarySync();
      setDiarySync('error');
      persistSharedDraft();
      document.getElementById('saveHint').textContent = '저장에 실패했어요. 다시 저장해 주세요.';
      toast('저장에 실패했어요. 입력한 내용은 그대로예요.');
    }
  } finally {
    if (sharedOperation === operation) { sharedOperation = null; diarySavePending = false; updateSharedActions(); }
  }
}
async function deleteEntry() {
  if (!currentUser || !spaceId || !myEntry(editingKey) || sharedOperation) return;
  if (!confirm('이 날의 내 일기를 삭제할까요? 되돌릴 수 없어요.')) return;
  const uid = currentUser.uid, id = spaceId, key = editingKey, session = sharedSession, before = sharedEditorValue();
  const operation = {kind:'delete'};
  sharedOperation = operation; diarySavePending = true;
  persistSharedDraft(); updateSharedActions(); setDiarySync('pending');
  try {
    await sharedStorage.remove(key, uid);
    if (session !== sharedSession || id !== spaceId) return;
    if (spaceData.sharedDiary?.[key]) delete spaceData.sharedDiary[key][uid];
    clearSharedDraft(key, before, uid, id);
    if (editingKey === key) {
      if (sameSharedContent(sharedEditorValue(), before)) renderEditor();
      else { sharedBaseline = {text:'',mood:MOODS[0]}; persistSharedDraft(); }
    }
    renderList(); renderMembers(); renderPartners();
    toast('일기를 삭제했어요.');
  } catch (error) {
    console.error('삭제 실패:', error);
    if (session === sharedSession && id === spaceId) { setDiarySync('error'); toast('삭제에 실패했어요. 기록은 그대로예요.'); }
  } finally {
    if (sharedOperation === operation) { sharedOperation = null; diarySavePending = false; updateSharedActions(); }
  }
}

// ══════════════════════════════════════
// 날짜 이동
// ══════════════════════════════════════
function guardDirty() {
  if (!persistSharedDraft() && isDirty() && !confirm('임시 저장하지 못했어요. 이동하면 작성 내용이 사라집니다. 이동할까요?')) return false;
  return true;
}
function moveDate(delta) {
  if (!guardDirty()) return;
  selectedDate.setDate(selectedDate.getDate() + delta);
  editingKey = dateKey(selectedDate);
  renderAll();
}
function goToday() {
  if (!guardDirty()) return;
  selectedDate = new Date();
  editingKey = dateKey(selectedDate);
  renderAll();
}
function onDatePick(v) {
  if (!v) return;
  if (!guardDirty()) { document.getElementById('datePicker').value = editingKey; return; }
  const [y,m,d] = v.split('-').map(Number);
  selectedDate = new Date(y, m-1, d);
  editingKey = dateKey(selectedDate);
  renderAll();
}
function moveMonth(delta) { viewMonth.setMonth(viewMonth.getMonth() + delta); renderList(); }

// ══════════════════════════════════════
// RENDER
// ══════════════════════════════════════
function renderAll() {
  const isToday = editingKey === dateKey(new Date());
  document.getElementById('heroDate').textContent =
    `${selectedDate.getMonth()+1}월 ${selectedDate.getDate()}일 (${DAYS_KO[selectedDate.getDay()]})${isToday ? ' · 오늘' : ''}`;
  document.getElementById('datePicker').value = editingKey;

  renderMembers();
  renderPartners();
  renderEditor();
  renderList();
}

function renderMembers() {
  const box = document.getElementById('memberChips');
  if (!spaceData) { box.innerHTML = ''; return; }
  const profiles = spaceData.memberProfiles || {};
  const members = spaceData.members || [];
  box.innerHTML = members.map(uid => {
    const p = profiles[uid] || { name: '멤버', photo: '' };
    const img = p.photo ? `<img src="${esc(p.photo)}" alt="" referrerpolicy="no-referrer">` : '👤';
    const me = currentUser && uid === currentUser.uid ? ' (나)' : '';
    return `<span class="member-chip">${img} ${esc(p.name)}${me}</span>`;
  }).join('');
  document.getElementById('soloHint').style.display = members.length > 1 ? 'none' : 'block';
}

// 카드 제목에 쓸 상대방 이름. 스페이스 멤버 프로필이 기준이고,
// 프로필이 아직 안 올라온 경우엔 그 날 일기에 담긴 이름으로 대신한다.
function partnerNames(entries) {
  const profiles = (spaceData && spaceData.memberProfiles) || {};
  const members = (spaceData && spaceData.members) || [];
  const isOther = uid => !currentUser || uid !== currentUser.uid;
  const uids = members.filter(isOther);
  const source = uids.length ? uids : Object.keys(entries || {}).filter(isOther);
  return source.map(uid =>
    (profiles[uid] && profiles[uid].name) || (entries && entries[uid] && entries[uid].name) || '멤버'
  );
}

function renderPartners() {
  const box = document.getElementById('partnerEntries');
  const entries = getEntries(editingKey);
  const others = Object.keys(entries).filter(uid => !currentUser || uid !== currentUser.uid);

  const names = partnerNames(entries);
  const label = names.length ? names.join('·') : '상대방';
  document.getElementById('partnerLabel').textContent = label;

  if (!others.length) {
    box.innerHTML = `<div class="empty-msg">${esc(label)}의 일기가 아직 없어요.</div>`;
    return;
  }
  box.innerHTML = others.map(uid => {
    const e = entries[uid];
    const img = e.photo ? `<img src="${esc(e.photo)}" alt="" referrerpolicy="no-referrer">` : '👤';
    const t = e.updatedAt ? new Date(e.updatedAt) : null;
    const time = t ? `${t.getMonth()+1}/${t.getDate()} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')} 작성` : '';
    return `<div class="partner-entry">
      <div class="partner-head">${img} <span>${e.mood || '📝'} ${esc(e.name || '멤버')}</span></div>
      <div class="partner-text">${esc(e.text)}</div>
      <div class="partner-time">${time}</div>
    </div>`;
  }).join('');
}

function renderEditor() {
  const mine = myEntry(editingKey);
  sharedBaseline = {text:mine?.text || '', mood:mine?.mood || MOODS[0]};
  document.getElementById('diaryArea').value = sharedBaseline.text;
  selectedMood = sharedBaseline.mood;
  const draft = readSharedDrafts().days[editingKey];
  if (draft && !sameSharedContent(draft, sharedBaseline)) {
    document.getElementById('diaryArea').value = draft.text || '';
    selectedMood = MOODS.includes(draft.mood) ? draft.mood : MOODS[0];
    document.getElementById('saveHint').textContent = '임시 저장본을 복원했어요.';
  } else document.getElementById('saveHint').textContent = '';
  document.getElementById('deleteBtn').style.display = mine ? 'inline-block' : 'none';
  renderMoodRow();
  updateCharCount();
}

function renderMoodRow() {
  document.getElementById('moodRow').innerHTML = MOODS.map(m =>
    `<button class="mood-btn ${m === selectedMood ? 'active' : ''}" onclick="pickMood('${m}')">${m}</button>`
  ).join('');
}
function pickMood(m) { selectedMood = m; renderMoodRow(); persistSharedDraft(); }
function updateCharCount() {
  document.getElementById('charCount').textContent = `${document.getElementById('diaryArea').value.length}자`;
}

function renderList() {
  const y = viewMonth.getFullYear(), m = viewMonth.getMonth();
  document.getElementById('monthLabel').textContent = `${y}년 ${m+1}월`;
  const prefix = `${y}-${String(m+1).padStart(2,'0')}`;
  const all = (spaceData && spaceData.sharedDiary) || {};
  const keys = Object.keys(all)
    .filter(k => k.startsWith(prefix) && Object.keys(all[k]).length)
    .sort().reverse();
  const box = document.getElementById('entryList');
  if (!keys.length) {
    box.innerHTML = '<div class="empty-msg">이 달에는 아직 교환일기가 없어요.<br>첫 일기를 남겨보세요.</div>';
    return;
  }
  box.innerHTML = keys.map(k => {
    const entries = all[k];
    const uids = Object.keys(entries);
    const [yy,mm,dd] = k.split('-').map(Number);
    const day = DAYS_KO[new Date(yy, mm-1, dd).getDay()];
    const moods = uids.map(u => entries[u].mood || '📝').join(' ');
    const names = uids.map(u => esc((entries[u].name || '멤버').split(' ')[0])).join(', ');
    const firstText = entries[uids[0]].text || '';
    return `<div class="entry-item ${k === editingKey ? 'selected' : ''}" onclick="goDate('${k}')">
      <div class="entry-head">
        <span>${moods}</span>
        <span class="entry-date">${mm}월 ${dd}일 (${day})</span>
        <span class="entry-authors">${names}</span>
      </div>
      <div class="entry-preview">${esc(firstText)}</div>
    </div>`;
  }).join('');
}

function goDate(k) {
  if (!guardDirty()) return;
  const [y,m,d] = k.split('-').map(Number);
  selectedDate = new Date(y, m-1, d);
  editingKey = k;
  renderAll();
}

// ══════════════════════════════════════
// THEME / TOAST
// ══════════════════════════════════════

// ══════════════════════════════════════
// 다시 들어왔을 때 오늘로 되돌리기
// ══════════════════════════════════════
// 앱(웹뷰)은 백그라운드로 보내도 페이지가 그대로 살아 있어서, 며칠 뒤 다시 열면
// 마지막으로 일기를 쓰던 날짜가 그대로 남아 있었다. 잠깐 앱을 전환한 정도가 아니라
// 실제로 '다시 들어온' 경우에만 오늘 날짜로 되돌린다.
// 저장하지 않은 초안이 있으면 날짜를 옮기지 않는다(내용이 사라지므로).
const RETURN_AFTER_MS = 60 * 1000;
let hiddenAt = 0;

function jumpToTodayOnReturn() {
  if (editingKey === dateKey(new Date())) return;
  if (isDirty()) return;
  selectedDate = new Date();
  editingKey = dateKey(selectedDate);
  viewMonth = new Date();
  renderAll();
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) { persistSharedDraft(); hiddenAt = Date.now(); return; }
  if (hiddenAt && Date.now() - hiddenAt >= RETURN_AFTER_MS) jumpToTodayOnReturn();
  hiddenAt = 0;
});
// 뒤로가기 등으로 살아 있던 페이지가 복원된 경우
window.addEventListener('pageshow', e => { if (e.persisted) jumpToTodayOnReturn(); });

document.getElementById('diaryArea').addEventListener('input', persistSharedDraft);
window.addEventListener('pagehide', persistSharedDraft);
window.addEventListener('beforeunload', event => {
  if (!persistSharedDraft() && isDirty()) { event.preventDefault(); event.returnValue = ''; }
});
loadTheme();
renderMoodRow();
renderAll();
updateSharedActions();
</script>
</body>
</html>
